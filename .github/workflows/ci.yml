# Build the plugin on Linux and run the test suite on every push and PR. Nothing else covers
# Linux: release.yml only reacts to tags, windows.yml only builds the Windows payload, and the
# AUR package builds on the user's own machine, so a commit that broke the Arch build used to
# reach katemark-git users before it reached anyone here.
#
# Arch in a container rather than a native ubuntu runner: Ubuntu's KF6 packages trail the
# frameworks this targets, and the AUR package is how Linux users install this, so the gate
# builds against the same rolling Qt6/KF6 they get. `pacman -Syu` is what picks those versions;
# the image digest only fixes the starting point, and it is the same pin publish-aur.yml uses.
#
# The preview is a QWebEngineView, so the test drives a headless Chromium as root. The offscreen
# platform and --no-sandbox come from the test's own ENVIRONMENT property in tests/CMakeLists.txt,
# so there is nothing to set here. The default 64 MB /dev/shm a container gets is enough for it
# (verified 2026-08-09: passes with and without a larger --shm-size).

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:base-devel@sha256:6db772fd1dd128b9cf7b7231ca5284af70879596fe4ec754c911cfc4ac30d5eb

    steps:
      # Mirrors aur/PKGBUILD's depends + makedepends, plus ninja for the generator this uses and
      # git for the checkout below (base-devel carries the compiler, not git).
      - name: install dependencies
        run: |
          set -Eeuo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git cmake ninja extra-cmake-modules \
            ktexteditor syntax-highlighting kxmlgui kconfig ki18n kcoreaddons qt6-base qt6-webengine

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON

      - name: build
        run: cmake --build build

      # --no-tests=error because a bare ctest exits 0 when it finds nothing to run, so a change
      # that stopped BUILD_TESTING from registering the test would leave this step green.
      - name: test
        run: ctest --test-dir build --output-on-failure --no-tests=error
