# Publish katemark-git to the AUR on push.
#
# Triggers when the packaging files change, regenerates .SRCINFO from aur/PKGBUILD, and pushes
# PKGBUILD + .SRCINFO to ssh://aur@aur.archlinux.org/katemark-git.git. The first run
# creates the AUR package; later runs fast-forward it.
#
# Required repo secrets:
#   AUR_SSH_PRIVATE_KEY — raw multi-line PEM of the key registered on aur.archlinux.org.
#                         Paste as-is: do NOT JSON-escape, do NOT wrap in quotes.
#   AUR_USERNAME        — your AUR username.
#
# The GitHub repo MUST be public: the PKGBUILD source is git+https://github.com/.../...git and
# AUR users clone it anonymously at build time. A private repo makes the package uninstallable.
#
# Third-party Actions are SHA-pinned because this workflow holds AUR push credentials — a mutable
# tag (`@v4`) lets a compromised tag exfiltrate that secret.

name: publish-aur

on:
  push:
    branches: [mommy]
    paths:
      - 'aur/**'
      - '.github/workflows/publish-aur.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:6db772fd1dd128b9cf7b7231ca5284af70879596fe4ec754c911cfc4ac30d5eb
      options: --user root
    steps:
      - name: install deps
        run: |
          set -Eeuo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git openssh sudo
          useradd -m builder

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: regenerate .SRCINFO
        run: |
          set -Eeuo pipefail
          # makepkg refuses to run as root; --printsrcinfo only parses PKGBUILD (no clone), so it
          # keeps .SRCINFO in lockstep with PKGBUILD even if a commit edited one without the other.
          chown -R builder:builder aur
          sudo -u builder bash -c 'cd aur && makepkg --printsrcinfo > .SRCINFO'
          chown -R root:root aur

      - name: publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME:        ${{ secrets.AUR_USERNAME }}
        run: |
          set -Eeuo pipefail
          umask 077
          # GitHub Actions sets HOME=/github/home in container jobs, but OpenSSH expands "~" via
          # the passwd database (/root for root) — so files the shell writes to ~/.ssh aren't the
          # ones ssh reads. Pin an absolute dir and point ssh at it via GIT_SSH_COMMAND below.
          sshdir="$HOME/.ssh"
          mkdir -p "$sshdir"
          # install -m 600 /dev/stdin creates the key at mode 600 atomically; strip any CR so a
          # CRLF-pasted secret doesn't break OpenSSH key parsing.
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY//$'\r'/}" | install -m 600 /dev/stdin "$sshdir/aur"
          ssh-keygen -y -f "$sshdir/aur" >/dev/null

          # Pinned AUR host keys — verify against https://wiki.archlinux.org/title/AUR :
          #   ED25519  SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          #   RSA      SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8
          install -m 600 /dev/stdin "$sshdir/known_hosts" <<'PIN'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ssh-rsa 
          PIN

          # Explicit paths + options so ssh reads exactly the files written above, regardless of
          # how it resolves "~". The remote URL already carries the aur user.
          export GIT_SSH_COMMAND="ssh -i $sshdir/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$sshdir/known_hosts -o StrictHostKeyChecking=yes"

          pkgver=$(awk -F= '/^pkgver=/{print $2; exit}' aur/PKGBUILD)
          new_pkgrel=$(awk -F= '/^pkgrel=/{print $2; exit}' aur/PKGBUILD)
          src="$GITHUB_WORKSPACE/aur"
          work=$(mktemp -d)

          git config --global user.email "${AUR_USERNAME}@users.noreply.aur"
          git config --global user.name  "$AUR_USERNAME"

          cd "$work"
          git init -q
          git remote add aur "ssh://aur@aur.archlinux.org/katemark-git.git"
          # Base on existing AUR history when the package already exists so the push is a clean
          # fast-forward; otherwise start fresh (legitimate first publish creates the package).
          # A -git package recomputes pkgver() on the user's machine at build time, so the static
          # pkgver/.SRCINFO is meaningless churn — only republish on first import or a pkgrel bump.
          if git fetch -q aur master 2>/dev/null; then
            git checkout -q -b master FETCH_HEAD
            old_pkgrel=$(awk -F= '/^pkgrel=/{print $2; exit}' PKGBUILD)
            if [ "$old_pkgrel" = "$new_pkgrel" ]; then
              echo "pkgrel unchanged ($old_pkgrel); nothing to publish"
              exit 0
            fi
          else
            git checkout -q -b master
          fi

          cp "$src/PKGBUILD" "$src/.SRCINFO" .
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already up to date"
            exit 0
          fi
          git commit -q -m "update AUR package"
          git push aur HEAD:master
